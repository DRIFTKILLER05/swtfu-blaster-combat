; DK_ModMenu options file for DK_Blaster (shown under MOD OPTIONS). Values are written to DK_Blaster.ini, which the
; mod re-reads within a second, so every option works at once.
[Mod]
Name=Blaster Combat
Author=DK
Ini=DK_Blaster.ini
Requires=DK_Blaster.dll
Order=40

[Option:Enabled]
Type=toggle
Label=Mod active
Section=Blaster
Key=Enabled
Default=1
Apply=live

; Key bindings: choose the row, then press the key or mouse button (Esc cancels). On= / Off= keep the default
; key for a DK_ModMenu older than 1.1, which shows a key option as a switch.
[Option:ToggleKey]
Type=key
Label=Draw / holster
Section=Blaster
Key=ToggleKey
Default=B
On=B
Off=B
Apply=live

